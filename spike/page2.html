<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SPIKE PAGE TWO</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { background: #2e7d32; color: #fff; font: 14px system-ui, sans-serif; padding: 8px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      #ck { position: absolute; left: 8px; bottom: 8px; font-size: 12px; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>SPIKE PAGE TWO</h1>
    <div id="ck">cookie: (none)</div>
    <script>
      setInterval(() => {
        document.getElementById("ck").textContent =
          "cookie: " + (document.cookie || "(none)");
      }, 500);
    </script>
  </body>
</html>
