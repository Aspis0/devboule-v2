<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SPIKE TEST PAGE</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { background: #ff5722; color: #fff; font: 14px system-ui, sans-serif; padding: 8px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      #btn { position: absolute; left: 40px; top: 120px; width: 120px; height: 36px; }
      #fld { position: absolute; left: 40px; top: 170px; width: 200px; height: 24px; }
      #ck { position: absolute; left: 8px; bottom: 8px; font-size: 12px; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1 id="t">SPIKE TEST PAGE</h1>
    <div>count: <span id="c">0</span></div>
    <button id="btn" type="button">click me</button>
    <input id="fld" type="text" />
    <div id="ck">cookie: (none)</div>
    <script>
      let n = 0;
      window.__count = 0;
      window.__clicks = [];
      setInterval(() => {
        n += 1;
        window.__count = n;
        document.getElementById("c").textContent = String(n);
      }, 250);
      document.getElementById("btn").addEventListener("click", (e) => {
        window.__clicks.push({ isTrusted: e.isTrusted, x: e.clientX, y: e.clientY });
      });
      setInterval(() => {
        document.getElementById("ck").textContent =
          "cookie: " + (document.cookie || "(none)");
      }, 500);
    </script>
  </body>
</html>
