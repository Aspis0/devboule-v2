<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7e0d2" />
    <title>Devboule</title>
    <!-- Pre-mount ground: the matching --ground-app (src/styles/tokens.css)
         behind the first paint. The bootstrap script below always resolves
         the stored choice onto data-theme before the first paint, so these
         rules key on it; the media query is only the fallback while nothing
         has set data-theme. The data-theme rules persist as the canvas
         behind body, which paints the same ground over them. Only light and
         dark exist (ThemePreference is closed), so the two rules are
         exhaustive. -->
    <style>
      html:not([data-theme]) {
        background-color: #e7e0d2;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          background-color: #16120e;
        }
      }
      html[data-theme="light"] {
        background-color: #e7e0d2;
      }
      html[data-theme="dark"] {
        background-color: #16120e;
      }
    </style>
    <!-- Theme before first paint: a same-origin file so script-src 'self'
         admits it in dev and production alike. Same key and values as
         src/lib/theme.ts; a test there walks it. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
