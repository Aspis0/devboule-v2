<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>artifact measure</title>
  <style>
    html, body { margin: 0; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
    #status { padding: 8px 12px; }
    #preview-box {
      width: 700px;
      height: 500px;
      position: relative;
      overflow: hidden;
      background: #fff;
    }
    .design-artifact-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }
    .design-artifact-measurement-frame {
      position: fixed;
      top: 0;
      left: -100000px;
      width: 700px;
      height: 500px;
      border: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">loading harness</div>
  <div id="preview-box" inert></div>
  <script type="module" src="./harness.ts"></script>
</body>
</html>
