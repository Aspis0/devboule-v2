[workspace]
members = [
    "src-tauri",
    "crates/devboule-protocol",
    "crates/devboule-daemon",
    "crates/oracle-core",
    "crates/devboule-augur",
    "crates/devboule-plugin-rpc",
    "crates/polis-backend",
]
resolver = "2"

[patch.crates-io]
# Patch esaxx-rs to use dynamic CRT (/MD) on Windows, matching ort-sys
# prebuilt binaries (rc.13). Without this, the linker fails with LNK2038:
# MT_StaticRelease vs MD_DynamicRelease. Must live in the workspace root —
# patches in member Cargo.tomls are ignored.
# Exit: drop this patch when upstream esaxx-rs builds with the dynamic CRT on
# Windows, or when `tokenizers` stops depending on esaxx-rs.
esaxx-rs = { path = "crates/oracle-core/vendor/esaxx-rs-0.1.10" }
# Patch portable-pty to reject malformed Windows environments: a malformed
# HKCU\Environment value (such as a REG_MULTI_SZ with embedded NULs) makes
# CreateProcessW fail with ERROR_INVALID_PARAMETER, so every PTY spawn dies.
# Vendored 0.9.0 plus herdr's 0003 patch (Apache-2.0, commit 56161969);
# see vendor/portable-pty.patches.md. Must live in the workspace root —
# patches in member Cargo.tomls are ignored.
# Exit: drop this patch when upstream portable-pty ships the fix.
portable-pty = { path = "vendor/portable-pty" }




# `target/` was 32.0 GiB before oracle-core, 47.8 GiB after compiling the
# library, and 91.8 GiB after `cargo test --workspace`. Default `debug = 2`
# stores full DWARF for every crate, including DataFusion, Arrow, Lance, ORT,
# and candle — code we never step through in a debugger. line-tables-only
# keeps rustc backtraces with source locations for workspace crates; debug =
# false on `[profile.dev.package."*"]` is the bulk of the size (dependencies
# are ~90% of compiled code).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
