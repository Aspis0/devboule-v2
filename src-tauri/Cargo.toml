[package]
name = "devboule"
version = "0.1.0"
description = "Devboule desktop shell"
edition = "2021"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
name = "devboule_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "devboule"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = ["config-json5"] }

[dependencies]
# Rust crates and npm packages follow separate release trains; do not align these versions.
# `protocol-asset` is the Files panel's full-size preview: it registers the
# `asset://` scheme and exposes `Manager::asset_protocol_scope()`, whose
# patterns come from `app.security.assetProtocol` in `tauri.conf.json`
# (checked with bytes in `backend/tests/asset_scope.rs`). `tray-icon` is the
# notification-area/menu-bar icon the app lives in after the window hides;
# runtime API only — nothing in `tauri.conf.json` configures a tray.
# `unstable` is `Window::add_child`: the browser tab is a child webview in
# the main window, and that API is still behind the flag in Tauri 2.11.
tauri = { version = "=2.11.5", features = ["config-json5", "protocol-asset", "tray-icon", "unstable"] }
# Direct because `src-tauri/src/browser/cdp_ws.rs` is a websocket: the socket's
# write and read halves are driven through `SinkExt` and `StreamExt`. Same
# features tokio-tungstenite asks for, no more: no executor and no timer of its
# own, so the app still runs on exactly one runtime.
futures-util = { version = "=0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
# The Chromium debugger transport, behind the same `Page` trait the WebView2
# child answers. `connect` (plain `ws://` to loopback) and `handshake` only, so
# `wss://` is refused by this module rather than half-supported by a TLS stack
# this app would have to trust. 0.30.0 is the latest stable major crates.io
# reports and drags tungstenite 0.30 in with it; JSON stays on the serde_json
# already here.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = [
    "connect",
    "handshake",
] }
# Direct because `cdp_ws.rs` hands each answer to exactly one waiter and cuts a
# call to the command's own deadline: `sync` for the waiters and the event
# channels, `time` for the cut, `macros` for the select that reads both event
# streams in `cdp_events.rs`. The same version the Tauri runtime resolves.
tokio = { version = "=1.53.1", default-features = false, features = [
    "macros",
    "sync",
    "time",
] }
# Direct because the public session contract derives Serialize/Deserialize. The exact
# version is already present transitively through Tauri; this does not add a new package.
serde = { version = "=1.0.229", features = ["derive"] }
# Shared wire types. The daemon and this crate must not declare their own copies.
devboule-protocol = { path = "../crates/devboule-protocol" }
# Blocking client + spawn helper. Pulls the daemon as a library; the GUI never
# runs the server in-process.
devboule-daemon = { path = "../crates/devboule-daemon", default-features = false }
# Plugin backend lifecycle. ORT-free. Must never pull polis-backend.
devboule-plugin-rpc = { path = "../crates/devboule-plugin-rpc" }
# Oracle is the local index/query runtime used by the Tauri command boundary.
oracle-core = { path = "../crates/oracle-core" }
tauri-plugin-dialog = "2.7.2"
# OS notifications from the frontend (`attentionNotice.ts` is the one
# caller). Same v2 release line as the dialog plugin; the npm package
# version is pinned separately in package.json.
tauri-plugin-notification = "2.4"
# The default application for one path — the File/Diff tab pencil, opened
# from the Rust command only (the plugin's injected link-click script stays
# off, so no JS package joins this). 2.5.5 is the newest line whose `tauri`
# requirement (^2.10) fits this crate's `tauri = "=2.11.5"` pin; 2.6+ demands
# tauri ^2.12.
tauri-plugin-opener = "2.5.5"
serde_json = "=1.0.151"
tempfile = "3"
# Plugin manifests carry a digest per file.
sha2 = "0.11"
# The Oracle endpoint's bearer: 32 fresh bytes per app start, drawn from the
# OS entropy source — never derived from pid/time. Same version the daemon
# already pins; 0.4 is the latest stable major.
getrandom = "=0.4.3"
# Saved logins' passwords, which live in this machine's OS credential store
# (the Windows Credential Manager here) instead of in any file of ours.
# `v1` is the feature that picks that store per platform — it is what pulls in
# `windows-native-keyring-store` on Windows — so the default features stay off
# and nothing above `browser/credentials/secrets.rs` names an OS. Same pin as
# the daemon, which keeps its device secrets in the same store.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
# Saved logins' origins are parsed by the same WHATWG URL parser the runtime
# uses, so the spelling this app stores is the spelling a frame's own origin
# serialises to — a comparison against a home-made canonicalisation is a
# comparison against the wrong string. Same copy the workspace already resolves.
url = "=2.5.8"
# Direct because `browser/cft_install.rs` downloads the pinned CfT zip over
# HTTPS: reqwest's blocking client, called from a blocking worker and never on
# the runtime (blocking builds a runtime of its own). Same version and
# features the daemon already resolves (`=0.12.28`, covered by the checker's
# inline exception: 0.13's rustls drags an aws-lc build the CI runner may not
# carry). Zip 8.6.0 is crates.io max stable; `deflate` only, the CfT zips'
# method (stored needs no feature).
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# Direct because `browser/cft_lock.rs` serializes profile ownership and
# installs across processes with an exclusive OS file lock: `try_lock` only,
# never blocking. 0.4.3 is crates.io max stable.
fs2 = "=0.4.3"

# Direct because `src-tauri/src/browser/page_host.rs` calls WebView2's COM
# interfaces itself for the four things Tauri 2.11 does not expose: history,
# stop, the page's favicon, and the permission answer. Versions must match
# Cargo.lock exactly, so we name the SAME types wry and Tauri use. Windows
# only; every other target compiles the refusals in the same module.
[target.'cfg(windows)'.dependencies]
# The attention toast's click: `attention_toast.rs` shows Windows' own WinRT
# toast so activation arrives in this process, which the notification plugin's
# sender cannot do. 0.7.3 is the version notify-rust (behind that plugin)
# already resolves, so the lock gains no package.
tauri-winrt-notification = "=0.7.3"
webview2-com = "=0.38.2"
# `Win32_System_Pipes` and `Win32_Storage_FileSystem` are for
# `src-tauri/src/browser/host_wire_tests.rs`, which binds the daemon's own pipe
# to drive the host loop over a real connection. `Win32_UI_Shell` and
# `Win32_System_Com` resolve the Start-menu folder the installer's shortcut
# lives in, and `UI_Notifications` clears our toasts from Action Center on the
# way out (`attention_toast.rs`). No new package: these are features of the
# crate already linked here for WebView2's COM interfaces.
windows = { version = "=0.61.3", features = [
    "UI_Notifications",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_Shell",
] }

[dev-dependencies]
# Already in the workspace; used to assert the Tauri error payload JSON.
serde_json = "=1.0.151"
# The loopback listener the in-process CDP endpoint in
# `browser/cdp_ws_fake.rs` accepts the transport's own tests on. The runtime
# that drives it is Tauri's, as it is for every other browser test. `rt` builds
# the current-thread runtime a watch is dropped on in `cdp_ws_watch_tests.rs`.
tokio = { version = "=1.53.1", default-features = false, features = ["net", "rt"] }
tauri = { version = "=2.11.5", features = ["test"] }
# Used by the command-boundary fake embedder in Oracle runtime tests.
anyhow = "1"
# Parses the sources the asyncness pins read at test time (backend/tests):
# a real parse is immune to comments and strings, a grep is not.
syn = { version = "3", features = ["full", "visit"] }
