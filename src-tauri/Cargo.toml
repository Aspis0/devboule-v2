[package]
name = "devboule"
version = "0.1.0"
description = "Devboule desktop shell"
edition = "2021"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
name = "devboule_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "devboule"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = ["config-json5"] }

[dependencies]
# Rust crates and npm packages follow separate release trains; do not align these versions.
tauri = { version = "=2.11.5", features = ["config-json5"] }
# Direct because the public session contract derives Serialize/Deserialize. The exact
# version is already present transitively through Tauri; this does not add a new package.
serde = { version = "=1.0.229", features = ["derive"] }
# Shared wire types. The daemon and this crate must not declare their own copies.
devboule-protocol = { path = "../crates/devboule-protocol" }
# Blocking client + spawn helper. Pulls the daemon as a library; the GUI never
# runs the server in-process.
devboule-daemon = { path = "../crates/devboule-daemon", default-features = false }

[target.'cfg(windows)'.dependencies]
# Window focus for single-instance behavior in src/single_instance.rs.
# windows-sys =0.59.0 is already pinned in the lockfile via devboule-daemon;
# this declares the same version directly. No new package enters the lockfile.
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
