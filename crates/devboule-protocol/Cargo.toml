[package]
name = "devboule-protocol"
version = "0.1.0"
description = "Shared wire types for the Devboule daemon protocol"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# Direct because every wire type derives Serialize/Deserialize. The exact
# version is already present in the workspace through Tauri; this does not
# add a new package.
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
# Already present in the workspace; used only to assert wire JSON.
serde_json = "=1.0.151"
