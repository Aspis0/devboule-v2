[package]
name = "devboule-protocol"
version = "0.1.0"
description = "Shared wire types for the Devboule daemon protocol"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# Direct because every wire type derives Serialize/Deserialize. The exact
# version is already present in the workspace through Tauri; this does not
# add a new package.
serde = { version = "=1.0.229", features = ["derive"] }
# Direct because plugin invoke payloads are JSON objects on the same frames
# as ping/status. Already in the workspace (daemon, src-tauri).
serde_json = "=1.0.151"
