[package]
name = "devboule-daemon"
version = "0.1.0"
description = "Devboule local daemon: single-instance lock, named pipe, handshake"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# Default includes the server so `cargo test --workspace` actually compiles
# and runs the daemon's session tests. The Tauri app depends on this crate
# with `default-features = false` and never runs the server in-process.
default = ["server"]
# portable-pty moves here from src-tauri with M3b: the daemon owns the PTY.
# Optional so a client-only build (the GUI process) does not link ConPTY.
# rusqlite is the conversation journal (M3c). Optional for the same reason:
# the GUI process never opens the database.
server = ["dep:portable-pty", "dep:rusqlite"]

[lib]
name = "devboule_daemon"
path = "src/lib.rs"

[[bin]]
name = "devboule-daemon"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
devboule-protocol = { path = "../devboule-protocol" }
# Direct because this crate serializes protocol frames to JSON. The exact
# version is already in the workspace (src-tauri dev-dependency and a
# transitive of serde). This does not add a new package.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Moved from src-tauri. Same pin. The daemon, not the GUI, now owns ConPTY.
portable-pty = { version = "=0.9.0", optional = true }
# Conversation journal. No drop-in exists (ARCHITETTURA §1.4); we take
# WAL/snapshot/retention invariants from wal3/ticktape and own the schema.
# `bundled` compiles sqlite3.c so the app does not depend on a system
# SQLite DLL — Windows does not ship one as a stable ABI. M4 brings
# oracle-core which already uses rusqlite 0.32 with `bundled` (lockfile
# 0.32.1); pinning the same version now avoids a duplicate sqlite at M4.
rusqlite = { version = "=0.32.1", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
# Named pipe, DACL, and LockFileEx. Already in the lockfile transitively
# (0.45 / 0.59 / 0.61 via Tauri). Pinned to the 0.59 line already present
# so we do not introduce a fourth windows-sys. Nothing in-tree exposes a
# named-pipe or file-lock API we could reuse.
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
