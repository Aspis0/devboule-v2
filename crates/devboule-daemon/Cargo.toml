[package]
name = "devboule-daemon"
version = "0.1.0"
description = "Devboule local daemon: single-instance lock, named pipe, handshake"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# Default includes the server so `cargo test --workspace` actually compiles
# and runs the daemon's session tests. The Tauri app depends on this crate
# with `default-features = false` and never runs the server in-process.
default = ["server"]
# portable-pty moves here from src-tauri with M3b: the daemon owns the PTY.
# Optional so a client-only build (the GUI process) does not link ConPTY.
# rusqlite is the conversation journal (M3c). Optional for the same reason:
# the GUI process never opens the database.
server = ["dep:portable-pty", "dep:rusqlite", "dep:alacritty_terminal", "dep:reqwest", "dep:uuid", "dep:base64", "dep:sha2", "dep:snow", "dep:keyring", "dep:zeroize", "dep:spake2", "dep:getrandom", "dep:hkdf"]

[lib]
name = "devboule_daemon"
path = "src/lib.rs"

[[bin]]
name = "devboule-daemon"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "devboule-acp-stub"
path = "src/bin/devboule_acp_stub.rs"
required-features = ["server"]

[[bin]]
name = "devboule-agent-stub"
path = "src/bin/devboule_agent_stub.rs"
required-features = ["server"]

[dependencies]
devboule-protocol = { path = "../devboule-protocol" }
# Direct because this crate serializes protocol frames to JSON. The daemon
# owns the ACP transport, so this is a new direct dependency of this crate.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# ACP wire/schema types, pinned exactly because this is a wire contract.
# 2.1.0 carries schema 1.7.0 and is Apache-2.0. The note this replaces called
# 2.0.0 "the audited release" and put its schema at 1.7.0: that is 2.1.0's
# schema, 2.0.0 shipped 1.5.0. Nobody has audited 2.1.0 — the pin holds the
# version still, it does not vouch for it.
agent-client-protocol = "=2.1.0"
# Moved from src-tauri. Same pin. The daemon, not the GUI, now owns ConPTY.
portable-pty = { version = "=0.9.0", optional = true }
alacritty_terminal = { version = "=0.26.0", optional = true }
# Conversation journal. No drop-in crate exists; we take
# WAL/snapshot/retention invariants from wal3/ticktape and own the schema.
# `bundled` compiles sqlite3.c so the app does not depend on a system
# SQLite DLL — Windows does not ship one as a stable ABI. The `bundled`
# feature compiles SQLite into the daemon and keeps its database ABI explicit.
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }
# ACP registry fetch. blocking + rustls only; tests inject a fake source and
# never open a socket. Pinned BEHIND latest stable (0.13) deliberately:
# 0.12.28 is already resolved in this workspace via oracle-core (hf-hub,
# lancedb), so the daemon reuses that artifact; 0.13's `rustls` feature pulls
# aws-lc-rs, a native cmake/NASM build the CI runner cannot be assumed to
# carry. Exit condition: move to 0.13 when oracle-core's dependents do.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
uuid = { version = "=1.26.0", features = ["v4"], optional = true }
# Prompt attachments: the bytes arrive base64 and are written under a sha256 of
# their content. Both are optional behind `server` for the same reason as
# rusqlite — a client-only build never writes an attachment to disk.
#
# Both are the latest stable major, which `check:dependency-majors` enforces and
# which an earlier pin to base64 0.22 failed. Both versions are also already in
# the lockfile through other crates, so neither adds a package — but that is the
# happy coincidence, not the rule: "already resolved" is a tie-breaker between
# versions the rule allows, never a reason to stay behind one it does not.
#
# The workspace still carries older sha2 and base64 majors for other crates
# (devboule-augur, devboule-plugin-rpc and oracle-core are on sha2 0.10). Nothing
# here crosses that boundary: sha256_hex returns a String, so no sha2 type is
# ever passed between crates and the two majors coexist.
base64 = { version = "=0.23.1", optional = true }
sha2 = { version = "=0.11.0", optional = true }
# Remote agents (slice 1). The daemon's long-term Noise static key comes from
# snow; its private half lives in the OS credential store (keyring v1: Windows
# Credential Manager). Both are behind `server`: a client-only build of this
# crate never generates or reads a device key.
snow = { version = "=0.10.0", optional = true }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"], optional = true }
# Envelope/PSK hygiene. The version snow's crypto backend already resolves in
# this workspace (curve25519-dalek -> zeroize 1.9.0).
zeroize = { version = "=1.9.0", optional = true }
# Pairing PAKE. MIT/Apache-2.0; not constant-time, which the design accepts for
# a single-use 40-bit code with lockout (DESIGN-remote-agents.md §9). Default
# features are required: `start_a`/`start_b` live behind `getrandom`.
spake2 = { version = "=0.4.0", optional = true }
# Pairing code entropy and key derivation, from the RustCrypto family whose
# digest major (`digest 0.11`) the `sha2` above already uses. Both versions are
# already resolved in Cargo.lock; nothing else may be selected.
#
# The entropy source is `getrandom` itself rather than a UUID: a v4 UUID carries
# six fixed version/variant bits, and a secret must not be derived from an
# identifier type. `hkdf` re-exports `hmac`, so HMAC is not a separate direct
# dependency.
getrandom = { version = "=0.4.3", optional = true }
hkdf = { version = "=0.13.0", optional = true }

[target.'cfg(windows)'.dependencies]
# Named pipe, DACL, and LockFileEx. Version 0.61.2 is already in the lockfile
# transitively through Tauri and portable-pty, so this direct dependency uses
# the same bindings without introducing another windows-sys version.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Wdk_System_SystemServices",
] }
