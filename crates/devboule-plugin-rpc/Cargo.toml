[package]
name = "devboule-plugin-rpc"
version = "0.1.0"
description = "Host-side plugin backend lifecycle: pipe/socketpair IPC, child group, invoke"
edition = "2021"
license = "Apache-2.0"
publish = false

# Test child for the Unix spawn tests: roles (serve, exit, fork a
# grandchild) are keyed off DEVBOULE_PLUGIN_ID, so the integration tests
# can drive real process-group behaviour without a production backend.
# Test-only: built for test targets via the self dev-dependency below,
# never for normal or release builds.
[[bin]]
name = "devboule-plugin-test-child"
path = "tests/support/test_child.rs"
test = false
required-features = ["test-fixture"]

[features]
test-fixture = []

[dependencies]
devboule-protocol = { path = "../devboule-protocol" }
# Framing and named-pipe connect. default-features = false so this crate
# never pulls ConPTY, SQLite, or the daemon server.
devboule-daemon = { path = "../devboule-daemon", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
# Peer identity (getpeereid, LOCAL_PEERPID), fd flags, SO_RCVTIMEO and
# process-group signals — the Unix half of the channel and child lifecycle.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Same pin as devboule-daemon. Pipe DACL, Job Object, process spawn flags.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# The fixture binary above needs its feature on every test build (plain
# `cargo test` passes no --features flag): a dev-dependency on the crate
# itself with the feature is what enables it, while normal and release
# builds never see the feature and skip the binary entirely.
devboule-plugin-rpc = { path = ".", features = ["test-fixture"] }
