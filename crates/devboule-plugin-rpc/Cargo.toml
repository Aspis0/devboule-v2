[package]
name = "devboule-plugin-rpc"
version = "0.1.0"
description = "Host-side plugin backend lifecycle: named pipe, Job Object, invoke"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
devboule-protocol = { path = "../devboule-protocol" }
# Framing and named-pipe connect. default-features = false so this crate
# never pulls ConPTY, SQLite, or the daemon server.
devboule-daemon = { path = "../devboule-daemon", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
# Same pin as devboule-daemon. Pipe DACL, Job Object, process spawn flags.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
