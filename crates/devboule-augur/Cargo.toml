[package]
name = "devboule-augur"
version = "0.1.0"
description = "Review findings for a plugin backend: detectors, a ledger, nothing that draws"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# Evidence redaction only. Secret *detection* uses vendored gitleaks TOML.
# `city` — not default/`full` — so linking Augur into polis-backend cannot
# pull ort/onnx into a plugin process that never embeds.
oracle-core = { path = "../oracle-core", default-features = false, features = ["city"] }
# Workspace pin. 0.32 was the old source crate; the lockfile unifies on 0.40.2
# because Cargo allows only one `links = "sqlite3"`.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
regex = "1"
toml = "1.1"
# SARIF 2.1.0 interchange. Pin exact: this is the boundary format, not the ledger.
serde-sarif = "=0.8.0"

[dev-dependencies]
tempfile = "3"
