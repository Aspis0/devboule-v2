[package]
name = "oracle-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
autotests = false
autoexamples = false

[lib]
name = "oracle_core"

[[bin]]
name = "oracle-cli"
path = "src/bin/oracle-cli.rs"
required-features = ["full"]

[[test]]
name = "chunker_golden_test"
path = "tests/chunker_golden_test.rs"
required-features = ["full"]

[[test]]
name = "bge_small_embed_test"
path = "tests/bge_small_embed_test.rs"
required-features = ["full"]

[[test]]
name = "e2e_real_onnx_test"
path = "tests/e2e_real_onnx_test.rs"
required-features = ["full"]

[[test]]
name = "store_test"
path = "tests/store_test.rs"
required-features = ["full"]

[[test]]
name = "retrieval_golden_test"
path = "tests/retrieval_golden_test.rs"
required-features = ["full"]

[[test]]
name = "reranker_real_onnx_test"
path = "tests/reranker_real_onnx_test.rs"
required-features = ["full"]

[[test]]
name = "lexical_golden_test"
path = "tests/lexical_golden_test.rs"
required-features = ["full"]

[[test]]
name = "int8_quality_test"
path = "tests/int8_quality_test.rs"
required-features = ["full"]

[[test]]
name = "indexer_test"
path = "tests/indexer_test.rs"
required-features = ["full"]

[[test]]
name = "engine_test"
path = "tests/engine_test.rs"
required-features = ["full"]

[[test]]
name = "embed_pool_test"
path = "tests/embed_pool_test.rs"
required-features = ["full"]

[[example]]
name = "token_window_probe"
path = "examples/token_window_probe.rs"
required-features = ["full"]

[[example]]
name = "recon_bench"
path = "examples/recon_bench.rs"
required-features = ["full"]

[[example]]
name = "doc_profile_corpus"
path = "examples/doc_profile_corpus.rs"
required-features = ["full"]

[[example]]
name = "bge_token_ratio"
path = "examples/bge_token_ratio.rs"
required-features = ["full"]

[dependencies]
fastembed = { version = "6", features = ["qwen3"], optional = true }
candle-core = { version = "0.11", optional = true }
lancedb = { version = "0.37", optional = true }
arrow-array = { version = "58.3", optional = true }
arrow-schema = { version = "59.2", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
anyhow = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Was 0.32 in the source crate. Bumped to the workspace pin so libsqlite3-sys
# unifies with devboule-daemon: Cargo allows only one `links = "sqlite3"` in
# the lockfile. See workspace Cargo.lock rusqlite 0.40.2 / libsqlite3-sys 0.38.2.
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }
blake2 = { version = "0.10", optional = true }
regex = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tokenizers = { version = "0.21", optional = true }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false, optional = true }
sysinfo = { version = "0.33", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal/CoreML are macOS-only — other targets must never see them.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-24", "coreml"], optional = true }
# sysctlbyname for kern.memorystatus_* pressure probes (no root required).
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# DirectML runs on any DX12 GPU (AMD/Intel/NVIDIA) with no CUDA toolkit, so it is
# the portable Windows GPU EP; it is Windows-only and must not leak to other targets.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-24", "directml"], optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
# Linux/other: CPU EP only (no GPU EP feature enabled).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# The city builder needs only the deterministic collector, path config, and
# read-only CKG reader. Keep that slice available to lightweight consumers;
# the desktop app and Augur retain the complete Oracle runtime by default.
default = ["full"]
city = [
    "dep:anyhow",
    "dep:rusqlite",
    "dep:regex",
]
embedder = [
    "dep:anyhow",
    "dep:candle-core",
    "dep:fastembed",
    "dep:regex",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokenizers",
    "dep:tokio",
    "dep:ort",
]
full = [
    "city",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:blake2",
    "embedder",
    "dep:chrono",
    "dep:clap",
    "dep:futures",
    "dep:lancedb",
    "dep:sha2",
    "dep:sysinfo",
    "dep:libc",
]
metal = ["full", "candle-core/metal", "fastembed/metal"]

# [patch.crates-io] for esaxx-rs lives in the workspace root Cargo.toml.
# Cargo ignores [patch] tables in workspace members. The vendored crate
# (Windows dynamic CRT /MD) is at vendor/esaxx-rs-0.1.10.
