name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node: `cache: pnpm` resolves the store
      # path by running `pnpm store path`, which fails if pnpm is not on PATH yet.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm run lint

      - name: Test frontend
        run: pnpm run test

      - name: Build frontend
        run: pnpm exec vite build

      - name: Check dependency shrinkwrap hygiene
        run: pnpm run check:shrinkwrap

      - name: Audit npm dependencies (High and above are blocking)
        run: pnpm audit --audit-level high

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build Rust workspace
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install pinned cargo-audit
        shell: pwsh
        run: |
          cargo audit --version
          if ($LASTEXITCODE -ne 0) {
            cargo install cargo-audit --version 0.22.2 --locked
          }

      - name: Audit Rust dependencies (vulnerabilities, including High, are blocking)
        # cargo-audit exits non-zero for vulnerabilities; unmaintained/unsound
        # advisory notices remain visible without turning Tauri's transitive GTK
        # notices into a false-green workaround.
        run: cargo audit
