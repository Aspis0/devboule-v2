name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be installed BEFORE setup-node: `cache: pnpm` resolves the store
      # path by running `pnpm store path`, which fails if pnpm is not on PATH yet.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm run lint

      - name: Test frontend
        run: pnpm run test

      - name: Build frontend
        run: pnpm exec vite build

      - name: Check dependency shrinkwrap hygiene
        run: pnpm run check:shrinkwrap

      - name: Check direct dependency major versions
        run: pnpm run check:dependency-majors

      - name: Audit npm dependencies (High and above are blocking)
        run: pnpm audit --audit-level high

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      # Since src-tauri links oracle-core, a cold build of this job compiles
      # DataFusion, Arrow, LanceDB, ORT and candle: measured locally at 31m49s
      # against 4m53s before (ARCHITETTURA §7.4). Without a cargo cache every
      # push pays that. `key` is the job name so the two Rust jobs do not fight
      # over one entry.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-workspace
          cache-on-failure: true

      # ort-sys downloads onnxruntime.lib and DirectML.dll from parcel.pyke.io
      # during the build and ignores cargo's offline mode (pykeio/ort#332), so
      # this is a build-time network dependency on a third-party CDN, not just a
      # slow step. Caching it removes the fetch and the outage.
      - name: Cache the ort runtime download
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-dfbin-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check frontend formatting
        run: pnpm run format:check

      # devboule links oracle-core, so this workspace job must provide protoc
      # and compile the Oracle graph transitively.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rust workspace
        run: cargo build --workspace --locked

      # oracle-core is excluded from the lint set, not from the build: src-tauri
      # depends on it, so it still compiles here with its default features, and
      # the oracle-core-check job below is what lints it.
      # `--all-features` must not reach it. Turning on every oracle-core feature
      # enables candle's Metal/CoreML path, which pulls objc2, which refuses to
      # compile off Apple: "only works on Apple platforms". Measured on this
      # machine — `--workspace --all-features` exits 101 on Windows.
      - name: Clippy
        run: cargo clippy --workspace --exclude oracle-core --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        # Default suite only. The #[ignore]d ConPTY / named-pipe tests are
        # not run in CI. On windows-latest (4 vCPU) at --test-threads=4,
        # one run passed all 27 pty_sessions tests in 101s; the next
        # failed 3 of them (handle-count bound, 1.9 MiB journal replay
        # loss, TimedOut("waiting for a daemon reply")). Failures move
        # between tests. A CI that goes red at random is worse than a
        # recorded gap. Local command:
        # cargo test --workspace --locked -- --ignored --test-threads=4
        run: cargo test --workspace --exclude oracle-core --locked

      - name: Install pinned cargo-audit
        shell: pwsh
        run: |
          cargo audit --version
          if ($LASTEXITCODE -ne 0) {
            cargo install cargo-audit --version 0.22.2 --locked
          }

      - name: Audit Rust dependencies (vulnerabilities, including High, are blocking)
        # cargo-audit exits non-zero for vulnerabilities; unmaintained/unsound
        # advisory notices remain visible without turning Tauri's transitive GTK
        # notices into a false-green workaround.
        run: cargo audit

  polis-plugin:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Polis dependencies
        working-directory: plugins/polis
        run: pnpm install --frozen-lockfile

      - name: Type-check Polis
        working-directory: plugins/polis
        run: pnpm exec tsc --noEmit

      - name: Test Polis
        working-directory: plugins/polis
        run: pnpm run test

      - name: Build Polis
        working-directory: plugins/polis
        run: pnpm run build

      - name: Verify Polis manifest
        working-directory: plugins/polis
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/plugin.json" -PathType Leaf)) {
            throw "Polis build did not produce dist/plugin.json"
          }

      - name: Check Polis formatting
        working-directory: plugins/polis
        run: pnpm run format:check

  # oracle-core is linted and tested here, not in the workspace job. src-tauri
  # depends on it, so the workspace job compiles it either way; what this job
  # owns is the -D warnings pass over oracle-core's own targets and the
  # serialised test run.
  oracle-core-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      # oracle-core pulls Lance, whose build scripts compile .proto files with
      # prost-build. Without protoc on PATH the build fails in lance-encoding
      # before a single line of our code is looked at — a missing tool reported
      # as a code failure. It is installed here rather than assumed because the
      # dev machine has it from winget, which says nothing about the runner.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Separate key from the workspace job: same crates, different target
      # selection, so sharing one entry would make each run evict the other.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: oracle-core
          cache-on-failure: true

      - name: Cache the ort runtime download
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-dfbin-${{ runner.os }}-

      # Free-disk steps are measurements: an earlier ~14 GiB estimate was wrong
      # versus the observed 33.9 GB free, so capacity claims must use these steps.
      # They now also tell us whether the restored cargo cache is crowding the
      # runner, which is the failure mode a cache introduces.
      - name: Report free disk before
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used,Free

      # -j 1 is deliberate. At default parallelism `cargo test` crashed rustc
      # locally with STATUS_STACK_BUFFER_OVERRUN (0xc0000409) while linking the
      # integration-test binaries, each of which statically links Lance,
      # DataFusion and ORT. Whether a 4-vCPU runner reproduces that is unknown;
      # serialising costs minutes and removes the question.
      # --all-targets keeps examples/recon_bench.rs compiling. It is the
      # measurement harness the chunk-size and model decisions came from, so
      # letting it rot would cost the next measurement, not just a build.
      - name: Clippy oracle-core
        run: cargo clippy -p oracle-core --locked --all-targets -- -D warnings

      - name: Test oracle-core
        run: cargo test -p oracle-core --locked -j 1

      - name: Report free disk after
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used,Free
