name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, Mondays 03:00 UTC. Only consumed by the
    # ignored-tests-informational job below; see its comment for why it is a
    # schedule and not a push trigger.
    - cron: "0 3 * * 1"
  # Lets the informational job be re-run by hand right after touching the
  # daemon's session code, instead of waiting up to a week.
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be installed BEFORE setup-node: `cache: pnpm` resolves the store
      # path by running `pnpm store path`, which fails if pnpm is not on PATH yet.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm run lint

      - name: Test frontend
        run: pnpm run test

      - name: Build frontend
        run: pnpm exec vite build

      - name: Check dependency shrinkwrap hygiene
        run: pnpm run check:shrinkwrap

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      # Since src-tauri links oracle-core, a cold build of this job compiles
      # DataFusion, Arrow, LanceDB, ORT and candle: measured locally at 31m49s
      # against 4m53s before. Without a cargo cache every push pays that. `key`
      # is the job name so the two Rust jobs do not fight over one entry.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-workspace
          cache-on-failure: true

      # ort-sys downloads onnxruntime.lib and DirectML.dll from parcel.pyke.io
      # during the build and ignores cargo's offline mode (pykeio/ort#332), so
      # this is a build-time network dependency on a third-party CDN, not just a
      # slow step. Caching it removes the fetch and the outage.
      - name: Cache the ort runtime download
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-dfbin-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check frontend formatting
        run: pnpm run format:check

      # devboule links oracle-core, so this workspace job must provide protoc
      # and compile the Oracle graph transitively.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rust workspace
        run: cargo build --workspace --locked

      # This step exists because every other Rust command in this file uses
      # --workspace --all-features, which unifies devboule-daemon's features
      # to "with server". But the shipped app links the daemon with
      # `default-features = false` (src-tauri/Cargo.toml): the GUI process
      # never runs the server, so portable-pty, rusqlite,
      # alacritty_terminal and reqwest are compiled out of the real binary.
      # That client-only configuration is therefore compiled HERE and
      # nowhere else — this step is not redundant with the workspace build,
      # it is the complement of it. Do not delete it. It targets the daemon
      # alone (not `cargo check -p devboule`) because the GUI crate pulls
      # oracle-core, lancedb and datafusion (measured locally: 6.5 min) for
      # coverage this step does not need; the daemon-only check runs in
      # seconds.
      - name: Check client-only daemon build (the configuration the shipped app links)
        run: cargo check -p devboule-daemon --no-default-features --locked

      # oracle-core is excluded from the lint set, not from the build: src-tauri
      # depends on it, so it still compiles here with its default features, and
      # the oracle-core-check job below is what lints it.
      # `--all-features` must not reach it. Turning on every oracle-core feature
      # enables candle's Metal/CoreML path, which pulls objc2, which refuses to
      # compile off Apple: "only works on Apple platforms". Measured on this
      # machine — `--workspace --all-features` exits 101 on Windows.
      - name: Clippy
        run: cargo clippy --workspace --exclude oracle-core --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        # Default suite only. The #[ignore]d ConPTY / named-pipe tests are
        # not run in CI. On windows-latest (4 vCPU) at --test-threads=4,
        # one run passed all 27 pty_sessions tests in 101s; the next
        # failed 3 of them (handle-count bound, 1.9 MiB journal replay
        # loss, TimedOut("waiting for a daemon reply")). Failures move
        # between tests. A CI that goes red at random is worse than a
        # recorded gap. Local command:
        # cargo test --workspace --locked -- --ignored --test-threads=4
        # That exact command runs on a weekly schedule in the
        # ignored-tests-informational job below, so a test that broke
        # permanently (rather than flakily) is still caught — without this
        # job ever gating a merge.
        run: cargo test --workspace --exclude oracle-core --locked

      - name: Install pinned cargo-audit
        shell: pwsh
        run: |
          cargo audit --version
          if ($LASTEXITCODE -ne 0) {
            cargo install cargo-audit --version 0.22.2 --locked
          }

      - name: Audit Rust dependencies (vulnerabilities, including High, are blocking)
        # cargo-audit exits non-zero for vulnerabilities; unmaintained/unsound
        # advisory notices remain visible without turning Tauri's transitive GTK
        # notices into a false-green workaround.
        run: cargo audit

      # These two run LAST, and the position is the point. Both reach the npm
      # registry, so both fail when a third party is unreachable — and while
      # they sat ahead of the Rust steps, every such failure marked build, fmt,
      # clippy and cargo test as never executed. Measured on 2026-09-03/04:
      # three times in one day the Rust half went dark, once for dependencies
      # genuinely behind (oxfmt, sha2), once for a fresh major (vitest 5), and
      # once for an npm registry outage that had nothing to do with this repo.
      # They stay blocking — the project's rule is every dependency on the
      # latest stable — but npm's uptime no longer decides whether our own code
      # gets compiled and tested.
      - name: Check direct dependency major versions
        run: pnpm run check:dependency-majors

      # Belongs in this last block for the same reason as the two around it: it
      # resolves npm package metadata, so a registry outage must not be able to
      # mark the Rust steps as never executed. THIRD_PARTY.md is the licence
      # inventory of a public repository; it was hand-maintained until it had
      # drifted by roughly 500 Rust packages and denied in writing that vendored
      # third-party source it does ship existed. This gate is what stops that
      # happening again.
      - name: Check the third-party licence inventory matches the lockfiles
        run: pnpm run check:third-party

      - name: Audit npm dependencies (High and above are blocking)
        run: pnpm audit --audit-level high

  polis-plugin:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Polis dependencies
        working-directory: plugins/polis
        run: pnpm install --frozen-lockfile

      - name: Type-check Polis
        working-directory: plugins/polis
        run: pnpm exec tsc --noEmit

      - name: Test Polis
        working-directory: plugins/polis
        run: pnpm run test

      - name: Build Polis
        working-directory: plugins/polis
        run: pnpm run build

      - name: Verify Polis manifest
        working-directory: plugins/polis
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/plugin.json" -PathType Leaf)) {
            throw "Polis build did not produce dist/plugin.json"
          }

      - name: Check Polis formatting
        working-directory: plugins/polis
        run: pnpm run format:check

  # oracle-core is linted and tested here, not in the workspace job. src-tauri
  # depends on it, so the workspace job compiles it either way; what this job
  # owns is the -D warnings pass over oracle-core's own targets and the
  # serialised test run.
  oracle-core-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      # oracle-core pulls Lance, whose build scripts compile .proto files with
      # prost-build. Without protoc on PATH the build fails in lance-encoding
      # before a single line of our code is looked at — a missing tool reported
      # as a code failure. It is installed here rather than assumed because the
      # dev machine has it from winget, which says nothing about the runner.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Separate key from the workspace job: same crates, different target
      # selection, so sharing one entry would make each run evict the other.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: oracle-core
          cache-on-failure: true

      - name: Cache the ort runtime download
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-dfbin-${{ runner.os }}-

      # Free-disk steps are measurements: an earlier ~14 GiB estimate was wrong
      # versus the observed 33.9 GB free, so capacity claims must use these steps.
      # They now also tell us whether the restored cargo cache is crowding the
      # runner, which is the failure mode a cache introduces.
      - name: Report free disk before
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used,Free

      # -j 1 is deliberate. At default parallelism `cargo test` crashed rustc
      # locally with STATUS_STACK_BUFFER_OVERRUN (0xc0000409) while linking the
      # integration-test binaries, each of which statically links Lance,
      # DataFusion and ORT. Whether a 4-vCPU runner reproduces that is unknown;
      # serialising costs minutes and removes the question.
      # --all-targets keeps examples/recon_bench.rs compiling. It is the
      # measurement harness the chunk-size and model decisions came from, so
      # letting it rot would cost the next measurement, not just a build.
      - name: Clippy oracle-core
        run: cargo clippy -p oracle-core --locked --all-targets -- -D warnings

      - name: Test oracle-core
        run: cargo test -p oracle-core --locked -j 1

      - name: Report free disk after
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used,Free

  # Informational, known-flaky, NEVER blocking. Runs the #[ignore]d ConPTY /
  # named-pipe tests that the windows job deliberately excludes — see the
  # comment on its "Test Rust workspace" step for the flakiness record.
  # Scheduled rather than push-triggered with continue-on-error, for two
  # reasons: (1) the tests are known-flaky, so a per-push run would paint a
  # red X on most commits — a red mark that blocks nothing is still a red
  # mark, and one that appears on every push trains people to dismiss the
  # job entirely; (2) the failure mode being watched for is permanent
  # breakage, not per-commit regressions, and a weekly run detects that
  # within days at ~1/30th of the runner cost. workflow_dispatch lets a
  # human trigger it on demand after touching the daemon's session code.
  # The `if` below is load-bearing: without it the job would also run on
  # push and pull_request (top-level `on:`), turning every push red at
  # random. No `continue-on-error` — on a scheduled run, red IS the signal.
  ignored-tests-informational:
    name: Ignored tests (informational, known-flaky, scheduled-only, non-blocking)
    runs-on: windows-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      # Even with --exclude oracle-core, src-tauri still links oracle-core as
      # a dependency, so the Oracle graph compiles here too and protoc is
      # required (same reason as in the windows job).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Separate key from the other jobs (same rationale as oracle-core's
      # cache): the scheduled run would otherwise overwrite the cache entry
      # that push builds restore. First run after a Cargo.lock change pays a
      # cold oracle-stack build; subsequent weekly runs are warm.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ignored-tests
          cache-on-failure: true

      - name: Cache the ort runtime download
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-dfbin-${{ runner.os }}-

      - name: "Run #[ignore]d tests (failures here are informational)"
        # --no-fail-fast: one red test must not stop the run, or every
        # ignored test after it reports nothing at all.
        run: cargo test --workspace --exclude oracle-core --locked --no-fail-fast -- --ignored --test-threads=4

  # The app must build on macOS too. Until this job is green, it is the
  # list of what does not: it checks every crate for the Mac target.
  macos:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      # Same reason as the windows job: src-tauri links oracle-core, whose
      # lance build scripts compile .proto files with prost-build.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The ort build script records a link path into this cache; a restored
      # target/ without it fails to link with "could not find onnxruntime".
      - name: Cache the ort runtime download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-dfbin-${{ runner.os }}-

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-build-ort
          cache-on-failure: true

      # --keep-going: one crate that does not build must not hide the next.
      - name: Check the workspace
        run: cargo check --workspace --all-targets --locked --keep-going

      - name: Plugin RPC tests
        # --no-fail-fast: the lib failure must not hide the integration run.
        run: cargo test -p devboule-plugin-rpc --locked --no-fail-fast

      # Slice 1 owner-only file modes: the helper plus every per-site test
      # whose name carries `owner_only`. One filter per step: cargo takes
      # a single filter argument.
      - name: Daemon owner-only file tests
        run: cargo test -p devboule-daemon --lib --locked owner_only

      - name: Daemon unix modes helper tests
        run: cargo test -p devboule-daemon --lib --locked unix_modes

      # Portable lock tests (now running on Unix via flock) plus the
      # lock-file creation mode test.
      - name: Daemon lock tests
        run: cargo test -p devboule-daemon --lib --locked lock::tests

      # The Oracle endpoint starts on its lock again with flock; this also
      # covers the owner-only record assertion from the macOS build fixes.
      # (The endpoint lives in the app crate, not the daemon.)
      - name: Daemon oracle endpoint tests
        run: cargo test -p devboule --lib --locked oracle::tests::endpoint

      # Slice 2 Unix transport primitives: bind/connect round-trip, modes,
      # path length, stale/live sockets, shutdown cleanup, peer identity.
      # Unix-only tests; on other targets this filter matches the portable
      # transport tests only.
      - name: Daemon Unix transport tests
        run: cargo test -p devboule-daemon --lib --locked transport

      # The socket carries a duplex conversation: a parked read must not
      # block a send, deadlines must hold, a parked reader must be wakeable.
      - name: Daemon Unix framing tests
        timeout-minutes: 10
        run: cargo test -p devboule-daemon --lib --locked framing::unix_tests

      # Slice 4 Unix startup smoke: the real server on a temp runtime dir —
      # bind, hello, ping, refused second daemon, graceful shutdown, stale
      # socket cleanup, journal modes. Unix-only.
      - name: Daemon Unix startup tests
        timeout-minutes: 10
        run: cargo test -p devboule-daemon --lib --locked unix_startup

      # Slice 5 Unix client end-to-end: connect_or_spawn starts the real
      # daemon binary, hello, ping, restart hands a new instance over,
      # shutdown. Spawns real processes; Unix-only.
      - name: Daemon Unix client tests
        timeout-minutes: 10
        run: cargo test -p devboule-daemon --locked --test unix_client_e2e

      # The ACP stub is a bin target, and a `--lib` test run builds no bin:
      # the session tests spawn the stub from target/debug, so it must exist
      # on disk before the whole-lib step (the Windows job gets it from
      # `cargo test --workspace`).
      - name: Build the ACP stub the session tests spawn
        run: cargo build -p devboule-daemon --bin devboule-acp-stub --features test-support --locked

      # Slice 6: the whole daemon lib suite on macOS, not a filter — the PTY,
      # session and provider tests run here once they work on Unix.
      - name: Daemon lib tests (all)
        timeout-minutes: 30
        run: cargo test -p devboule-daemon --lib --locked

  # Slice 3 (CfT process manager) owns this job: the websocket transport is
  # cross-platform code and only a Mac can verify the mac-arm64 Chromium
  # lifecycle. Everything here is headless; a headed pane with compositor
  # frames needs a logged-in runner and stays a hand-run smoke. macos-14 is
  # arm64, so Platform::here() resolves to the pinned MacArm64 build.
  macos-cft:
    name: macos-cft
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      # Same reason as the windows job: src-tauri links oracle-core, whose
      # lance build scripts compile .proto files with prost-build.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The ort build script records a link path into this cache; a restored
      # target/ without it fails to link with "could not find onnxruntime".
      - name: Cache the ort runtime download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-dfbin-${{ runner.os }}-

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-cft-ort
          cache-on-failure: true

      - name: Check devboule
        run: cargo check -p devboule --locked

      - name: Test browser module
        run: cargo test -p devboule --lib browser --locked

      # URL and digest are read from the reviewed manifest in the checkout, so
      # this step fails on an archive the pin does not describe rather than on
      # a second copy of the number that could drift. The installer re-checks
      # the same digest over the same bytes in the next step.
      - name: Download the pinned mac-arm64 archive and verify its digest
        run: |
          set -euo pipefail
          spec=$(awk '
            /^    mac_arm64: Archive \{/ { found = 1 }
            found && /url:/ { url = $2 }
            found && /sha256:/ { print url, $2; exit }
          ' src-tauri/src/browser/cft_manifest.rs | tr -d '",')
          url=${spec% *}
          digest=${spec#* }
          curl --fail --location --output "$RUNNER_TEMP/chrome-mac-arm64.zip" "$url"
          echo "$digest  $RUNNER_TEMP/chrome-mac-arm64.zip" | shasum --algorithm 256 --check

      # The real installer, not an unzip: hash before unpack, top-directory
      # strip, framework symlinks and exec bits. The installed executable is
      # published to the next step from the one place that built the path.
      - name: Install the verified archive through the browser's own installer
        env:
          DEVBOULE_CFT_ARCHIVE: ${{ runner.temp }}/chrome-mac-arm64.zip
          DEVBOULE_CFT_APP_DATA: ${{ runner.temp }}/cft-app-data
        run: |
          set -euo pipefail
          cargo test -p devboule --lib --locked \
            the_pinned_mac_archive_installs_with_its_framework_links \
            -- --ignored --nocapture
          version=$(awk '
            /^pub const PINNED: Pin = Pin \{/ { found = 1 }
            found && /version:/ { gsub(/[",]/, "", $2); print $2; exit }
          ' src-tauri/src/browser/cft_manifest.rs)
          echo "DEVBOULE_CFT_CHROME=$DEVBOULE_CFT_APP_DATA/chrome-for-testing/$version/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" >> "$GITHUB_ENV"

      # The ignored real-CfT tests: headless launch, DevToolsActivePort,
      # ownership probe, create target, navigate a data: URL, evaluate, close.
      - name: Real CfT lifecycle, headless
        run: |
          set -euo pipefail
          test -x "$DEVBOULE_CFT_CHROME"
          cargo test -p devboule --lib browser::cft_process::cft --locked \
            -- --ignored --nocapture --test-threads=1
