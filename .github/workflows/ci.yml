name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be installed BEFORE setup-node: `cache: pnpm` resolves the store
      # path by running `pnpm store path`, which fails if pnpm is not on PATH yet.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm run lint

      - name: Test frontend
        run: pnpm run test

      - name: Build frontend
        run: pnpm exec vite build

      - name: Check dependency shrinkwrap hygiene
        run: pnpm run check:shrinkwrap

      - name: Check direct dependency major versions
        run: pnpm run check:dependency-majors

      - name: Audit npm dependencies (High and above are blocking)
        run: pnpm audit --audit-level high

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check frontend formatting
        run: pnpm run format:check

      - name: Build Rust workspace
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        # Default suite. #[ignore]d ConPTY / named-pipe tests run in
        # windows-integration.
        run: cargo test --workspace --locked

      - name: Install pinned cargo-audit
        shell: pwsh
        run: |
          cargo audit --version
          if ($LASTEXITCODE -ne 0) {
            cargo install cargo-audit --version 0.22.2 --locked
          }

      - name: Audit Rust dependencies (vulnerabilities, including High, are blocking)
        # cargo-audit exits non-zero for vulnerabilities; unmaintained/unsound
        # advisory notices remain visible without turning Tauri's transitive GTK
        # notices into a false-green workaround.
        run: cargo audit

  # Separate job so a ConPTY failure is about integration, not mixed into
  # fmt/clippy/frontend. Still blocking: no continue-on-error.
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Show runner cores
        shell: pwsh
        run: Write-Output "NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"

      - name: Test ignored ConPTY and named-pipe suite
        # 4 vCPU runner; bound threads to match. ConPTY is a scarce OS
        # resource (local 22-wide default flakes as moving timeouts).
        # Skip pipe_dacl_is_current_user_only: the GitHub-hosted runner is
        # Administrator, so the pipe SDDL is D:P(A;;FA;;;LA) rather than
        # the numeric S-1-5-21-…-500 SID. dacl_is_current_user_only only
        # matches the numeric form. That is a checker gap in daemon src,
        # not a flake, and this change does not touch production code.
        run: cargo test --workspace --locked -- --ignored --test-threads=4 --nocapture --skip pipe_dacl_is_current_user_only
