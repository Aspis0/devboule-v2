name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be installed BEFORE setup-node: `cache: pnpm` resolves the store
      # path by running `pnpm store path`, which fails if pnpm is not on PATH yet.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint frontend
        run: pnpm run lint

      - name: Test frontend
        run: pnpm run test

      - name: Build frontend
        run: pnpm exec vite build

      - name: Check dependency shrinkwrap hygiene
        run: pnpm run check:shrinkwrap

      - name: Check direct dependency major versions
        run: pnpm run check:dependency-majors

      - name: Audit npm dependencies (High and above are blocking)
        run: pnpm audit --audit-level high

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check frontend formatting
        run: pnpm run format:check

      # oracle-core is a workspace member but is excluded from the three heavy
      # Rust steps below. Measured on the dev machine (22 logical cores) on
      # 2026-08-28, not assumed:
      #   * cold `cargo build -p oracle-core --lib` takes ~8-10 min; its
      #     dependency graph is DataFusion + LanceDB + Arrow + ORT + candle.
      #   * target/ grew from 32.0 GiB to 47.8 GiB after that library build
      #     alone, and to 91.8 GiB after `cargo test --workspace`.
      #     windows-latest ships with roughly 14 GiB free: the build cannot fit.
      #   * `cargo test --workspace` at default parallelism crashed rustc with
      #     STATUS_STACK_BUFFER_OVERRUN (0xc0000409) while linking the nine
      #     integration-test binaries, each of which statically links that whole
      #     graph. `-j 1` completes in ~15 min.
      # `cargo fmt --all` below still covers it, because formatting needs no build.
      # Verified locally instead, and this is the command that does it:
      #   cargo clippy --workspace --all-targets --locked -- -D warnings
      #   cargo test --workspace --locked -j 1
      # Exit: drop the --exclude when oracle-core runs on a runner with the disk
      # for it, or when the embedding path moves behind a feature flag that CI
      # can leave off.
      - name: Build Rust workspace
        run: cargo build --workspace --exclude oracle-core --locked

      - name: Clippy
        run: cargo clippy --workspace --exclude oracle-core --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        # Default suite only. The #[ignore]d ConPTY / named-pipe tests are
        # not run in CI. On windows-latest (4 vCPU) at --test-threads=4,
        # one run passed all 27 pty_sessions tests in 101s; the next
        # failed 3 of them (handle-count bound, 1.9 MiB journal replay
        # loss, TimedOut("waiting for a daemon reply")). Failures move
        # between tests. A CI that goes red at random is worse than a
        # recorded gap. Local command:
        # cargo test --workspace --locked -- --ignored --test-threads=4
        run: cargo test --workspace --exclude oracle-core --locked

      - name: Install pinned cargo-audit
        shell: pwsh
        run: |
          cargo audit --version
          if ($LASTEXITCODE -ne 0) {
            cargo install cargo-audit --version 0.22.2 --locked
          }

      - name: Audit Rust dependencies (vulnerabilities, including High, are blocking)
        # cargo-audit exits non-zero for vulnerabilities; unmaintained/unsound
        # advisory notices remain visible without turning Tauri's transitive GTK
        # notices into a false-green workaround.
        run: cargo audit

  # oracle-core cannot be built on this runner (see the note in the windows job:
  # ~16 GiB of artifacts against ~14 GiB free). `cargo check` produces metadata
  # and rlibs but no codegen for the final crate, so it fits where a full build
  # does not, and it still catches the failure that actually happens when a
  # crate is edited: type errors. It is a smaller net than the local
  # clippy + test run, and it is honest about being one.
  oracle-core-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      # oracle-core pulls Lance, whose build scripts compile .proto files with
      # prost-build. Without protoc on PATH the build fails in lance-encoding
      # before a single line of our code is looked at — a missing tool reported
      # as a code failure. It is installed here rather than assumed because the
      # dev machine has it from winget, which says nothing about the runner.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report free disk before
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used,Free

      - name: Type-check oracle-core
        run: cargo check -p oracle-core --locked --all-targets

      - name: Report free disk after
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used,Free
