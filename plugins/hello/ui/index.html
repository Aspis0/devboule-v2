<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello plugin</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #05070d;
        color: #f7f9ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070d;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .readout {
        position: relative;
        z-index: 1;
        width: min(46rem, calc(100% - 2rem));
        margin: 1rem;
        padding: 1.25rem 1.5rem;
        border: 1px solid rgb(255 255 255 / 35%);
        border-radius: 0.8rem;
        background: rgb(4 7 17 / 88%);
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 35%);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.3rem);
        line-height: 1.1;
      }

      .lede {
        margin: 0.45rem 0 1rem;
        color: #c7d2fe;
        font-size: clamp(1rem, 2vw, 1.2rem);
      }

      .fact {
        margin: 0.65rem 0;
        font-size: clamp(1rem, 2.2vw, 1.25rem);
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .label {
        color: #8df0d0;
        font-weight: 800;
      }

      .prominent {
        padding: 0.6rem 0.75rem;
        border: 2px solid #ff6b6b;
        border-radius: 0.55rem;
        color: #fff;
        background: rgb(127 29 29 / 70%);
        font-weight: 900;
      }

      code {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="A rotating WebGL2 triangle"></canvas>
    <main class="readout" aria-live="polite">
      <h1>Hello plugin</h1>
      <p class="lede">Live measurements from inside this sandboxed frame</p>
      <p class="fact" id="webgl">WebGL2: measuring…</p>
      <p class="fact" id="tauri">Tauri internals: measuring…</p>
      <p class="fact" id="bridge">Bridge reply: waiting…</p>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
